<app-select
  [options]="allWorks"
  valueKey="id"
  labelKey="name"
  nullLabel="All Site Works"
  [ngModel]="activeWorkId"
  (ngModelChange)="selectWork($event)"
  triggerClass="bg-neutral-800/80 backdrop-blur text-white py-2 rounded-full text-sm border border-neutral-700 hover:border-neutral-600 w-48"
></app-select>
