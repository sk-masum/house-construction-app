<div class="surface-card p-4 rounded-xl relative">
  <div
    class="flex justify-between items-end border-b border-neutral-700 pb-3 mb-3 pr-8"
  >
    <div>
      <p class="text-[10px] text-neutral-500 uppercase tracking-wider m-0 mb-1">
        Amount
      </p>
      <p class="text-2xl font-bold text-blue-400 m-0">
        ₹{{ item.amount | number: "1.2-2" }}
      </p>
    </div>
    <div class="text-right">
      <span class="text-xs text-neutral-400 whitespace-nowrap">{{
        item.dateTime | date: "MMM d, y, h:mm a"
      }}</span>
    </div>
  </div>
  <div class="flex items-center justify-between mt-2">
    <div class="flex-1">
      <p class="text-[10px] text-neutral-500 uppercase tracking-wider m-0 mb-1">
        Provider (From)
      </p>
      <p class="text-sm text-neutral-200 m-0 truncate">
        {{ item.provider }}
      </p>
    </div>
    <div class="px-3 text-neutral-500">
      <span nz-icon nzType="arrow-right" nzTheme="outline"></span>
    </div>
    <div class="flex-1 text-right">
      <p class="text-[10px] text-neutral-500 uppercase tracking-wider m-0 mb-1">
        Receiver (To)
      </p>
      <p class="text-sm text-neutral-200 m-0 truncate">
        {{ item.receiver }}
      </p>
    </div>
  </div>
  <div class="absolute top-3 right-2 flex gap-2">
    <button
      (click)="openDrawerEvent.emit(item)"
      class="text-neutral-400 hover:text-blue-400 bg-transparent border-none p-1"
    >
      <span nz-icon nzType="edit"></span>
    </button>
    <button
      nz-popconfirm
      nzPopconfirmTitle="Delete?"
      nzPopconfirmPlacement="left"
      (nzOnConfirm)="deleteTransactionEvent.emit(item.id!)"
      class="text-neutral-400 hover:text-red-400 bg-transparent border-none p-1"
    >
      <span nz-icon nzType="delete"></span>
    </button>
  </div>
</div>
