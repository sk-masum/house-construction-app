<div class="px-4 pt-4">
  <app-page-header
    title="Transactions"
    (buttonClick)="openDrawer()"
  ></app-page-header>
  <!-- View Switcher (Using Centralized TabSwitcherComponent) -->
  <app-tab-switcher
    [tabs]="tabs"
    [activeValue]="activeView"
    (onTabChange)="onTabChange($event)"
    class="mb-6"
  ></app-tab-switcher>

  <!-- VIEW 1: BY DATE -->
  @if (activeView === "date") {
    <app-transaction-by-date
      [dateGroups]="dateGroups"
      [itemCardTemplate]="itemCard"
    ></app-transaction-by-date>
  }

  <!-- VIEW 2: BY RECEIVER (List Summary) -->
  @if (activeView === "receiver") {
    <app-transaction-receiver
      [receiverGroups]="receiverGroups"
      (openDetailEvent)="openDetail($event.name, $event.type)"
    ></app-transaction-receiver>
  }

  <!-- DRILL-DOWN DRAWER -->
  <nz-drawer
    [nzVisible]="isDetailVisible"
    nzPlacement="right"
    [nzWidth]="'100%'"
    [nzTitle]="detailTitle + ' Ledger'"
    (nzOnClose)="closeDetail()"
  >
    <ng-container *nzDrawerContent>
      <div class="flex flex-col gap-4 pb-10">
        @for (item of detailItems; track item.id) {
          <ng-container
            *ngTemplateOutlet="itemCard; context: { $implicit: item }"
          ></ng-container>
        }
      </div>
    </ng-container>
  </nz-drawer>

  <!-- ADD / EDIT DRAWER -->
  <nz-drawer
    [nzVisible]="isDrawerVisible"
    nzPlacement="bottom"
    nzTitle="Log Transaction"
    nzHeight="auto"
    (nzOnClose)="closeDrawer()"
  >
    <ng-container *nzDrawerContent>
      <app-transaction-form
        [transactionForm]="transactionForm"
        [displayTransactions]="displayTransactions"
        [directoryReceivers]="directoryReceivers"
        (submitEvent)="submitForm()"
      ></app-transaction-form>
    </ng-container>
  </nz-drawer>

  <!-- REUSABLE TRANSACTION CARD TEMPLATE -->
  <ng-template #itemCard let-item>
    <app-transaction-card
      [item]="item"
      (openDrawerEvent)="openDrawer($event)"
      (deleteTransactionEvent)="deleteTransaction($event)"
    ></app-transaction-card>
  </ng-template>
</div>
