<div class="grid grid-cols-2 gap-3">
  @if (materialGroups.length === 0) {
    <div class="col-span-2 text-center text-neutral-500 mt-10">
      <p>No materials found.</p>
    </div>
  }
  @for (group of materialGroups; track group.name) {
    <div
      (click)="openDetail(group.name, 'material')"
      class="surface-card surface-card-interactive p-4 rounded-xl flex flex-col justify-between active:scale-95 transition-transform cursor-pointer"
    >
      <div class="mb-3">
        <h3 class="text-lg font-bold text-emerald-400 m-0 truncate">
          {{ group.name }}
        </h3>
        <p class="text-xs text-neutral-400 m-0">{{ group.count }} Logs</p>
      </div>
      <div>
        <p class="text-[10px] text-neutral-500 uppercase m-0 mb-1">
          Total Spent
        </p>
        <p class="text-lg font-semibold text-white m-0">
          ₹{{ group.totalPrice | number: "1.0-0" }}
        </p>
      </div>
    </div>
  }
</div>
