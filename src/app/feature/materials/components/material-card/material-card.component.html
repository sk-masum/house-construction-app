<div class="surface-card p-4 rounded-xl relative">
  <div class="flex justify-between items-start mb-2 pr-12">
    <h3 class="text-lg font-bold text-white m-0 truncate">
      {{ item.deliveryDate | date: "MMM d, y" }}
    </h3>
    <!-- <span class="text-xs text-neutral-400 whitespace-nowrap">{{
      item.deliveryDate | date: "MMM d, y"
    }}</span> -->
  </div>
  <div class="mb-4">
    <span class="bg-neutral-700 text-neutral-300 text-xs px-2 py-1 rounded-md">
      {{ item.qty }} × ₹{{ item.unitPrice | number: "1.0-0" }}
    </span>
  </div>
  <div class="flex justify-between items-end pt-3 border-t border-neutral-700">
    <div>
      <p class="text-[10px] text-neutral-500 uppercase m-0 mb-1">Total Price</p>
      <p class="text-xl font-semibold text-emerald-400 m-0">
        ₹{{ item.totalPrice | number: "1.2-2" }}
      </p>
    </div>
    <div class="text-right">
      <p class="text-[10px] text-neutral-500 uppercase m-0 mb-1">Builder</p>
      <p class="text-sm text-neutral-200 m-0 truncate max-w-[120px]">
        {{ item.builderName }}
      </p>
    </div>
  </div>
  <div class="absolute top-3 right-2 flex gap-0.5">
    <button
      (click)="openDrawer(item)"
      class="text-neutral-400 hover:text-blue-400 bg-transparent border-none p-1"
    >
      <span nz-icon nzType="edit"></span>
    </button>
    <button
      nz-popconfirm
      nzPopconfirmTitle="Delete?"
      nzPopconfirmPlacement="left"
      (nzOnConfirm)="deleteMaterial(item.id!)"
      class="text-neutral-400 hover:text-red-400 bg-transparent border-none p-1"
    >
      <span nz-icon nzType="delete"></span>
    </button>
  </div>
</div>
