@if (isLoading) {
  <div class="flex justify-center items-center py-20">
    <nz-spin nzSimple nzSize="large"></nz-spin>
  </div>
} @else {
  <div class="px-4 pt-4">
    <app-page-header
      title="Materials"
      (buttonClick)="openDrawer()"
    ></app-page-header>

    <!-- View Switcher (Using Centralized TabSwitcherComponent) -->
    <app-tab-switcher
      [tabs]="tabs"
      [activeValue]="activeView"
      (onTabChange)="onTabChange($event)"
      class="mb-6"
    ></app-tab-switcher>

    <!-- VIEW 1: BY DATE (Grouped List) -->
    @if (activeView === "date") {
      <app-date-view
        [dateGroups]="dateGroups"
        [itemCardTemplate]="itemCard"
      ></app-date-view>
    }

    <!-- VIEW 2: BY MATERIAL (Grid Summary) -->
    @if (activeView === "material") {
      <app-material-view
        [materialGroups]="materialGroups"
        (openDetailEvent)="openDetail($event.name, $event.type)"
      ></app-material-view>
    }

    <!-- VIEW 3: BY BUILDER (List Summary) -->
    @if (activeView === "builder") {
      <app-builder-view
        [builderGroups]="builderGroups"
        (openDetailEvent)="openDetail($event.name, $event.type)"
      ></app-builder-view>
    }

    <!-- DRILL-DOWN DETAIL DRAWER (Slides from Right) -->
    <nz-drawer
      [nzVisible]="isDetailVisible"
      nzPlacement="right"
      [nzWidth]="'100%'"
      [nzTitle]="detailTitle + ' History'"
      (nzOnClose)="closeDetail()"
    >
      <ng-container *nzDrawerContent>
        <div class="flex flex-col gap-4 pb-10">
          @if (activeView === "builder") {
            <app-builder-details
              [builderName]="detailTitle"
              [builderDetailGroups]="builderDetailGroups"
              (openDrawerEvent)="openDrawer($event)"
              (deleteMaterialEvent)="deleteMaterial($event)"
            ></app-builder-details>
          } @else {
            @for (item of detailItems; track item.id) {
              <!-- Reusable Item Card template (minimal for detail view) -->
              <ng-container
                *ngTemplateOutlet="
                  itemCard;
                  context: { $implicit: item, view: 'detail' }
                "
              ></ng-container>
            }
          }
        </div>
      </ng-container>
    </nz-drawer>

    <!-- FORM DRAWER (Slides from Bottom) -->
    <nz-drawer
      [nzVisible]="isDrawerVisible"
      nzPlacement="bottom"
      nzTitle="Log Material"
      nzHeight="auto"
      (nzOnClose)="closeDrawer()"
    >
      <ng-container *nzDrawerContent>
        <app-material-form
          [materialForm]="materialForm"
          [dynamicMaterialOptions]="dynamicMaterialOptions"
          [dynamicPriceDefaults]="dynamicPriceDefaults"
          [builderOptions]="builderOptions"
          (submitFormEvent)="submitForm()"
        ></app-material-form>
      </ng-container>
    </nz-drawer>

    <!-- REUSABLE CARD TEMPLATE -->
    <ng-template #itemCard let-item let-view="view">
      <app-material-card
        [item]="item"
        [view]="view"
        (openDrawerEvent)="openDrawer($event)"
        (deleteMaterialEvent)="deleteMaterial($event)"
      />
    </ng-template>
  </div>
}
