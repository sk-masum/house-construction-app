<!-- Wallet Hero: Total Project Balance -->
<div
  class="bg-neutral-800 p-5 rounded-2xl border border-neutral-700 shadow-lg mb-6 flex justify-between items-center relative overflow-hidden"
>
  <div class="z-10">
    <p class="text-[11px] text-neutral-400 uppercase tracking-wider mb-1 m-0">
      {{ activeProject ? "Project Due Balance" : "Global Due Balance" }}
    </p>
    <div class="flex items-baseline gap-2 mt-1">
      <p
        class="text-2xl font-bold m-0"
        [ngClass]="
          isAdvance
            ? 'text-emerald-400'
            : outstandingBalance === 0
              ? 'text-white'
              : 'text-red-400'
        "
      >
        ₹{{
          (isAdvance ? outstandingBalance * -1 : outstandingBalance)
            | number: "1.0-0"
        }}
      </p>
      @if (isAdvance) {
        <span
          class="text-[10px] font-bold uppercase text-emerald-400 bg-emerald-400/10 border border-emerald-400/20 px-2 py-1 rounded-md"
          >Advance</span
        >
      } @else if (outstandingBalance > 0) {
        <span
          class="text-[10px] font-bold uppercase text-red-400 bg-red-400/10 border border-red-400/20 px-2 py-1 rounded-md"
          >To Pay</span
        >
      } @else {
        <span
          class="text-[10px] font-bold uppercase text-neutral-300 bg-neutral-600 border border-neutral-500 px-2 py-1 rounded-md"
          >Settled</span
        >
      }
    </div>
  </div>
  <div class="z-10 opacity-20">
    <span
      nz-icon
      nzType="wallet"
      class="text-6xl"
      [ngClass]="isAdvance ? 'text-emerald-400' : 'text-red-400'"
    ></span>
  </div>
  <div
    class="absolute -right-8 -bottom-8 w-32 h-32 rounded-full blur-3xl"
    [ngClass]="isAdvance ? 'bg-emerald-500/20' : 'bg-red-500/20'"
  ></div>
</div>
