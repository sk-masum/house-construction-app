<div class="px-4 pt-4">
  <app-dashboard-balance
    class="contents"
    [activeProject]="activeProject"
    [outstandingBalance]="outstandingBalance"
    [isAdvance]="isAdvance"
  ></app-dashboard-balance>

  <app-dashboard-estimation
    class="contents"
    [activeProject]="activeProject"
    [totalEstimatedMaterialCost]="totalEstimatedMaterialCost"
    [totalServiceCharge]="totalServiceCharge"
    [progressData]="progressData"
  ></app-dashboard-estimation>

  <app-dashboard-current-purchase
    class="contents"
    [activeProject]="activeProject"
    [totalMaterialCost]="totalMaterialCost"
    [totalEstimatedMaterialCost]="totalEstimatedMaterialCost"
    [contractorPaid]="contractorPaid"
    [totalTransactions]="totalTransactions"
  ></app-dashboard-current-purchase>

  <app-dashboard-payment-breakdown
    class="contents"
    [contractorTotal]="contractorTotal"
    [contractorPaid]="contractorPaid"
    [materialTotal]="materialTotal"
    [materialPaid]="materialPaid"
  ></app-dashboard-payment-breakdown>

  <app-dashboard-purchase-distribution
    class="contents"
    [pieChartData]="pieChartData"
    [pieChartOptions]="pieChartOptions"
  ></app-dashboard-purchase-distribution>

  <app-dashboard-recent-activity
    class="contents"
    [recentActivity]="recentActivity"
  ></app-dashboard-recent-activity>
</div>
