<div class="px-4 pt-4 pb-[80px]">
  <app-page-header
    title="Projects"
    (buttonClick)="openNewWork()"
  ></app-page-header>

  <div class="flex flex-col gap-4">
    @for (work of works; track work.id) {
      <app-project-card
        [project]="work"
        (editProject)="editProject($event)"
        (deleteProject)="deleteProject($event)"
      ></app-project-card>
    }
    @if (works.length === 0) {
      <div class="text-center text-neutral-500 mt-10">
        No projects created yet.
      </div>
    }
  </div>

  <!-- Create Work Drawer -->
  <nz-drawer
    [nzVisible]="isDrawerVisible"
    nzPlacement="bottom"
    [nzTitle]="currentWorkId ? 'Project Setup' : 'Create New Work'"
    [nzHeight]="'85vh'"
    (nzOnClose)="closeDrawer()"
  >
    <ng-container *nzDrawerContent>
      <sk-stepper #stepper>
        <cdk-step
          label="Contract Details"
          [ariaDisabled]="currentWorkId !== null"
        >
          <app-contract-details-form
            [projectForm]="workForm"
            [contractorOptions]="contractorOptions"
            (saveWorkStep)="saveWorkStep()"
          ></app-contract-details-form>
        </cdk-step>

        <!-- STEP 2: Material Estimations -->
        <cdk-step
          label="Material Estimations"
          [completed]="currentEstimations.length > 0"
        >
          <app-material-estimation-form
            [currentEstimations]="currentEstimations"
            [estimationForm]="estimationForm"
            [dynamicMaterialOptions]="dynamicMaterialOptions"
            (removeEstimation)="removeEstimation($event)"
            (addEstimation)="addEstimation()"
            (closeDrawer)="closeDrawer()"
          ></app-material-estimation-form>
        </cdk-step>
      </sk-stepper>
    </ng-container>
  </nz-drawer>
</div>
