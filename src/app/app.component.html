<!-- Main Content Area: dynamically loads your pages -->
<main
  class="safe-area-view text-neutral-100"
>
  <router-outlet></router-outlet>
</main>

<!-- PWA Bottom Navigation Bar -->
<nav
  class="safe-area-navigation"
  aria-label="Main navigation"
>
  <div class="glass-dock">
    <!-- Dashboard Tab -->
    <a
      routerLink="/dashboard"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      class="dock-tab"
    >
      <span
        nz-icon
        nzType="appstore"
        nzTheme="outline"
        class="dock-icon"
      ></span>
      <span class="dock-label"
        >Dashboard</span
      >
    </a>

    <!-- Materials Tab -->
    <a
      routerLink="/materials"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
      class="dock-tab"
    >
      <span
        nz-icon
        nzType="gold"
        nzTheme="outline"
        class="dock-icon"
      ></span>
      <span class="dock-label"
        >Materials</span
      >
    </a>

    <!-- Transactions Tab -->
    <a
      routerLink="/transactions"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
      class="dock-tab"
    >
      <span
        nz-icon
        nzType="swap"
        nzTheme="outline"
        class="dock-icon"
      ></span>
      <span class="dock-label"
        >Ledger</span
      >
    </a>
  </div>
</nav>
