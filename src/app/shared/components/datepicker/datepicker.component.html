<!-- The Visible Tailwind Container -->
<div
  class="relative overflow-hidden cursor-pointer focus-within:border-emerald-500 {{
    triggerClass
  }}"
  [ngClass]="{ 'opacity-50 pointer-events-none': isDisabled }"
>
  <!-- 1. Beautifully Styled Fake Text -->
  <span
    class="truncate text-sm"
    [ngClass]="internalStringValue ? 'text-white' : 'text-neutral-500'"
  >
    {{ internalStringValue ? internalStringValue : placeholder }}
  </span>

  <!-- 2. Custom Icon -->
  <span
    nz-icon
    [nzType]="mode === 'datetime' ? 'clock-circle' : 'calendar'"
    class="text-neutral-400 text-sm ml-2 shrink-0"
  ></span>

  <!-- 3. The Invisible Native Trigger -->
  <!-- Because it is absolute, it has ZERO impact on layout width -->
  <input
    [type]="mode === 'date' ? 'date' : 'datetime-local'"
    [value]="internalStringValue"
    (input)="onInputChange($event)"
    [disabled]="isDisabled"
    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10 p-0 m-0 box-border"
  />
</div>
