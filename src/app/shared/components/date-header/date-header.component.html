<div
  class="date-group-header flex justify-between items-end mb-4 border-b border-neutral-700 pb-3 sticky top-[env(safe-area-inset-top)] z-20 -mx-4 px-4 pt-3 shadow-sm"
>
  <div>
    <h2 class="text-lg font-bold text-white m-0">
      {{ displayDate | date: "MMM d, yyyy - EEEE" }}
    </h2>
    <p class="text-xs text-neutral-400 m-0">{{ numberOfPayments }} payments</p>
  </div>
  <div class="text-right">
    <p class="text-[10px] text-neutral-500 uppercase tracking-wider m-0 mb-1">
      Daily Total
    </p>
    <p class="text-{{ theme }}-400 font-semibold m-0 text-base">
      ₹{{ totalAmount | number: "1.2-2" }}
    </p>
  </div>
</div>
